<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receivables · Vietnam Sparkle</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <main class="page has-admin-dock">
      <section id="auth-view" class="auth-shell hidden">
        <div class="auth-card">
          <span class="pill">Owner sign-in required</span>
          <h2>Sign in to view receivables</h2>
          <div class="button-row">
            <a class="button-link primary" href="./admin.html">Go to sign in</a>
          </div>
        </div>
      </section>

      <div id="app-view" class="hidden">
        <a class="cog-button floating-settings" href="./settings.html" title="Settings" aria-label="Settings">⚙</a>
        <section class="hero admin-dock">
          <h1>Receivables</h1>
          <div class="button-row">
            <a class="button-link secondary" href="./admin.html">Dashboard</a>
            <a class="button-link secondary" href="./customers.html">Customers</a>
            <a class="button-link secondary" href="./orders.html">Orders</a>
            <a class="button-link secondary" href="./map.html">Map</a>
            <a class="button-link secondary" href="./receivables.html">Receivables</a>
            <a class="button-link secondary" href="./deposits.html">Deposits</a>
          </div>
          <div id="receivables-nag-tiles" class="stats-grid" style="margin-top:14px"></div>
        </section>

        <section class="panel">
          <div class="toolbar">
            <div>
              <p class="muted" id="list-status"></p>
            </div>
            <div class="button-row">
              <input id="search-input" type="search" placeholder="Search customer / order / phone" style="min-width:220px">
              <button class="secondary" id="refresh-button" type="button">Refresh</button>
            </div>
          </div>
          <div class="customer-table-wrap">
            <table class="customer-table receivables-table">
              <thead>
                <tr>
                  <th>Delivered</th>
                  <th>Days</th>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Order</th>
                  <th style="text-align:right">Balance</th>
                  <th>Follow-up</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="receivable-rows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <dialog id="invoice-dialog" class="edit-dialog" style="max-width:min(760px,95vw);width:100%">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px">
          <h3 style="margin:0">Invoice preview</h3>
          <button class="ghost" type="button" id="invoice-close-button">Close</button>
        </div>
        <div class="button-row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <button class="primary" type="button" id="invoice-download-button">Download PDF</button>
          <button class="secondary" type="button" id="invoice-email-button" style="display:none">Send via email</button>
          <a class="button-link secondary" id="invoice-whatsapp-button" href="#" target="_blank" rel="noopener" style="display:none">Send via WhatsApp</a>
          <span class="muted" id="invoice-status"></span>
        </div>
        <div id="invoice-preview-slot" style="max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff"></div>
      </dialog>

      <dialog id="record-payment-dialog" class="edit-dialog">
        <form id="record-payment-form" class="form-grid" style="min-width:min(480px,90vw)">
          <h3 class="span-2" style="margin:0">Record payment — <span id="record-payment-customer"></span></h3>
          <p class="muted span-2" style="margin:0">Balance due: <strong id="record-payment-due">0 VND</strong></p>
          <input type="hidden" id="record-payment-order-id">
          <label>
            Amount collected
            <input id="record-payment-amount" type="number" min="0" step="1000" required>
          </label>
          <label>
            Method
            <select id="record-payment-method" required>
              <option value="cash">Cash</option>
              <option value="transfer">Bank transfer</option>
              <option value="bank_qr">QR code</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="span-2">
            Reference (optional)
            <input id="record-payment-reference" type="text" maxlength="199" placeholder="Bank reference or note">
          </label>
          <div class="span-2 button-row">
            <button class="primary" type="submit">Save payment</button>
            <button class="ghost" type="button" id="record-payment-cancel-button">Discard</button>
            <span class="muted" id="record-payment-status"></span>
          </div>
        </form>
      </dialog>
    </main>

    <script type="module" src="./assets/receivablesApp.js"></script>
  </body>
</html>
