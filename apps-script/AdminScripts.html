<script>
  function createEmptyAuditState() {
    return {
      summary: {},
      recentPayments: [],
      recentDeposits: [],
      recentReturns: [],
      recentPurchases: [],
      recentExpenses: [],
      recentDocuments: [],
      unpaidOrders: [],
      customerBalances: []
    };
  }

  function cloneData(value) {
    return JSON.parse(JSON.stringify(value));
  }

  const state = {
    config: window.__APP_CONFIG__ || {},
    initialData: window.__ADMIN_INITIAL_DATA__ || null,
    products: [],
    helpers: [],
    orders: [],
    customers: [],
    customersLoaded: false,
    totals: null,
    effectiveDate: null,
    currentHistory: null,
    auditDate: null,
    audit: createEmptyAuditState()
  };

  document.addEventListener('DOMContentLoaded', () => {
    try {
      wireTabs();
      bindActions();
      initializeDates();
      loadDashboard();
    } catch (error) {
      showLoadError(error);
    }
  });

  function wireTabs() {
    document.querySelectorAll('.tab-link').forEach((button) => {
      button.addEventListener('click', () => activateTab(button.dataset.tabTarget));
    });
  }

  function activateTab(tabId) {
    document.querySelectorAll('.tab-link').forEach((item) => item.classList.toggle('active', item.dataset.tabTarget === tabId));
    document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.toggle('active', panel.id === `tab-${tabId}`));
    if (tabId === 'customers' || tabId === 'money') {
      loadCustomerDirectory();
    }
    if (tabId === 'money') {
      loadMoneyData();
    }
  }

  function bindActions() {
    document.getElementById('refresh-dashboard').addEventListener('click', () => loadDashboard());
    document.getElementById('seed-test-data').addEventListener('click', seedTestData);
    document.getElementById('save-order').addEventListener('click', saveOrderFromForm);
    document.getElementById('load-history').addEventListener('click', () => loadCustomerHistory());
    document.getElementById('lookup-customer').addEventListener('click', lookupCustomerForForm);
    document.getElementById('filter-status').addEventListener('change', renderTodayBoard);
    document.getElementById('filter-helper').addEventListener('change', renderTodayBoard);
    document.getElementById('record-payment').addEventListener('click', savePayment);
    document.getElementById('record-return').addEventListener('click', saveReturn);
    document.getElementById('record-purchase').addEventListener('click', savePurchase);
    document.getElementById('record-expense').addEventListener('click', saveExpense);
    document.getElementById('record-document').addEventListener('click', saveDocument);
    document.getElementById('initial-payment-amount').addEventListener('input', updateOrderComposer);

    // Delegated: hero pending-approval tile jumps into filtered board
    document.getElementById('hero-totals').addEventListener('click', (event) => {
      const tile = event.target.closest('.tile[data-hero-action="review-pending"]');
      if (tile) jumpToPendingApprovals();
    });

    // Banner "Review pending" button
    const banner = document.getElementById('pending-approval-jump');
    if (banner) banner.addEventListener('click', jumpToPendingApprovals);

    wireMoneySubTabs();

    document.addEventListener('input', (event) => {
      if (event.target.matches('.catalog-qty')) {
        updateOrderComposer();
      }
    });
  }

  function initializeDates() {
    const today = new Date().toISOString().slice(0, 10);
    ['payment-date', 'return-date', 'purchase-date', 'expense-date'].forEach((id) => {
      const element = document.getElementById(id);
      if (element && !element.value) {
        element.value = today;
      }
    });
    document.getElementById('business-name').textContent = `${state.config.businessName || 'Water Delivery'} Owner`;
  }

  function runServer(method, payload) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('This dashboard must be opened from the Apps Script web app URL.'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => reject(new Error(error.message || error)))
        [method](payload);
    });
  }

  async function loadDashboard() {
    try {
      const date = document.getElementById('dashboard-date').value;
      if ((!date || date === normalizeDateString(state.initialData?.board?.effectiveDate)) && state.initialData) {
        hydrateDashboardFromPayload_(state.initialData.bootstrap, state.initialData.board);
        state.initialData = null;
        return;
      }
      const bootstrap = await runServer('getAdminCatalogBootstrap');
      if (!bootstrap || !bootstrap.config) {
        throw new Error('Empty catalog bootstrap response from server.');
      }
      if (bootstrap.ok === false) {
        throw new Error(bootstrap.error || 'Catalog bootstrap failed.');
      }
      const board = await runServer('getTodayBoardMobile', date);
      if (!board) {
        throw new Error('Empty today board response from server.');
      }
      if (board.ok === false) {
        throw new Error(board.error || 'Today board failed.');
      }
      state.config = bootstrap.config;
      state.products = Array.isArray(bootstrap.products) ? bootstrap.products : [];
      state.helpers = Array.isArray(bootstrap.helpers) ? bootstrap.helpers : [];
      state.orders = Array.isArray(board.orders) ? board.orders : [];
      state.customers = [];
      state.customersLoaded = false;
      state.totals = board.totals || {};
      state.effectiveDate = board.effectiveDate || date;
      state.auditDate = null;
      state.audit = createEmptyAuditState();
      syncBusinessDateFields();
      hydrateSelects();
      renderHeroTotals();
      renderCatalogPickers();
      renderTodayBoard();
      renderCustomerCards(true);
      renderMoneyScreen(true);
      updateOrderComposer();
      const activeTab = document.querySelector('.tab-link.active')?.dataset.tabTarget;
      if (activeTab === 'customers' || activeTab === 'money') {
        await loadCustomerDirectory(true);
      }
      if (activeTab === 'money') {
        await loadMoneyData(true);
      }
    } catch (error) {
      showLoadError(error);
    }
  }

  function hydrateDashboardFromPayload_(bootstrap, board) {
    if (!bootstrap || !bootstrap.config) {
      throw new Error('Empty catalog bootstrap response from server.');
    }
    if (bootstrap.ok === false) {
      throw new Error(bootstrap.error || 'Catalog bootstrap failed.');
    }
    if (!board) {
      throw new Error('Empty today board response from server.');
    }
    if (board.ok === false) {
      throw new Error(board.error || 'Today board failed.');
    }
    state.config = bootstrap.config;
    state.products = Array.isArray(bootstrap.products) ? bootstrap.products : [];
    state.helpers = Array.isArray(bootstrap.helpers) ? bootstrap.helpers : [];
    state.orders = Array.isArray(board.orders) ? board.orders : [];
    state.customers = [];
    state.customersLoaded = false;
    state.totals = board.totals || {};
    state.effectiveDate = board.effectiveDate || new Date().toISOString().slice(0, 10);
    state.auditDate = null;
    state.audit = createEmptyAuditState();
    syncBusinessDateFields();
    hydrateSelects();
    renderHeroTotals();
    renderCatalogPickers();
    renderTodayBoard();
    renderCustomerCards(true);
    renderMoneyScreen(true);
    updateOrderComposer();
    const activeTab = document.querySelector('.tab-link.active')?.dataset.tabTarget;
    if (activeTab === 'customers' || activeTab === 'money') {
      loadCustomerDirectory(true);
    }
    if (activeTab === 'money') {
      loadMoneyData(true);
    }
  }

  async function loadCustomerDirectory(force = false) {
    if (!force && state.customersLoaded) {
      renderCustomerCards(false);
      hydrateCustomerSelect();
      return;
    }

    renderCustomerCards(true);
    try {
      const customers = await runServer('getAdminCustomerDirectory');
      state.customers = Array.isArray(customers) ? customers : [];
      state.customersLoaded = true;
      hydrateCustomerSelect();
      renderCustomerCards(false);
    } catch (error) {
      state.customers = [];
      state.customersLoaded = false;
      const message = error && error.message ? error.message : String(error);
      document.getElementById('customers-list').innerHTML = `
        <div class="history-card"><strong>Customer load error</strong><div class="muted top-gap">${escapeHtml(message)}</div></div>
      `;
    }
  }

  async function loadMoneyData(force = false) {
    const targetDate = state.effectiveDate || document.getElementById('dashboard-date').value;
    if (!targetDate) return;
    if (!force && state.auditDate === targetDate && state.audit && state.audit.summary) {
      renderMoneyScreen(false);
      return;
    }
    renderMoneyScreen(true);
    try {
      state.audit = await runServer('getAdminMoneySnapshot', targetDate) || createEmptyAuditState();
      state.auditDate = targetDate;
      renderMoneyScreen(false);
    } catch (error) {
      const message = error && error.message ? error.message : String(error);
      document.getElementById('audit-summary-grid').innerHTML = `
        <div class="history-card"><strong>Money screen error</strong><div class="muted top-gap">${escapeHtml(message)}</div></div>
      `;
    }
  }

  async function seedTestData() {
    const hero = document.getElementById('hero-totals');
    if (hero) {
      hero.innerHTML = '<div class="history-card">Creating test customers and orders...</div>';
    }
    try {
      const result = await runServer('seedTestDataForOwner');
      await loadDashboard();
      const created = result && result.createdOrders ? result.createdOrders.length : 0;
      const dateLabel = result && result.effectiveDate ? result.effectiveDate : '';
      document.getElementById('hero-totals').innerHTML += `<div class="top-gap muted">Seeded ${created} test orders${dateLabel ? ` for ${escapeHtml(dateLabel)}` : ''}.</div>`;
    } catch (error) {
      showLoadError(error);
    }
  }

  function showLoadError(error) {
    const message = error && error.message ? error.message : String(error);
    const title = message.includes('catalog bootstrap') ? 'Catalog load error'
      : message.includes('today board') ? 'Today board load error'
      : 'Dashboard error';
    const hero = document.getElementById('hero-totals');
    if (hero) {
      hero.innerHTML = `
        <div class="status-pill danger">${escapeHtml(title)}</div>
        <div class="top-gap">${escapeHtml(message)}</div>
      `;
    }
    const board = document.getElementById('today-board');
    if (board) {
      board.innerHTML = `<div class="history-card"><strong>Could not load dashboard.</strong><div class="muted top-gap">${escapeHtml(message)}</div></div>`;
    }
  }

  function syncBusinessDateFields() {
    if (!state.effectiveDate) return;
    const dashboardDate = document.getElementById('dashboard-date');
    const deliveryDate = document.getElementById('order-delivery-date');
    if (dashboardDate) {
      dashboardDate.value = state.effectiveDate;
    }
    if (deliveryDate && !deliveryDate.value) {
      deliveryDate.value = state.effectiveDate;
    }
  }

  function hydrateSelects() {
    hydrateSimpleSelect('initial-payment-method', state.config.paymentMethods);
    hydrateSimpleSelect('payment-method', state.config.paymentMethods);
    hydrateSimpleSelect('expense-payment-method', state.config.paymentMethods);
    hydrateSimpleSelect('expense-category', state.config.expenseCategories);
    hydrateSimpleSelect('document-type', state.config.documentTypes);
    hydrateSimpleSelect('return-condition', state.config.returnConditions);
    hydrateSimpleSelect('filter-status', state.config.orderStatuses, { keepFirst: true });
    hydrateHelperSelect(document.getElementById('order-helper'));
    hydrateHelperFilter();
    hydrateOrderSelects();
    hydrateCustomerSelect();
  }

  function hydrateSimpleSelect(elementId, values, options = {}) {
    const select = document.getElementById(elementId);
    if (!select) return;
    const preservedValue = select.value;
    const first = options.keepFirst ? select.querySelector('option')?.outerHTML || '' : '';
    select.innerHTML = first + (values || []).map((value) => `<option value="${escapeAttribute(value)}">${humanize(value)}</option>`).join('');
    if (preservedValue) select.value = preservedValue;
  }

  function hydrateHelperSelect(select, selectedValue = '') {
    if (!select) return;
    select.innerHTML = '<option value="">Unassigned</option>' + state.helpers
      .map((helper) => `<option value="${escapeAttribute(helper.helperId)}">${escapeHtml(helper.helperName)}</option>`)
      .join('');
    select.value = selectedValue || (state.helpers[0] ? state.helpers[0].helperId : '');
  }

  function hydrateHelperFilter() {
    const select = document.getElementById('filter-helper');
    if (!select) return;
    const preservedValue = select.value;
    select.innerHTML = '<option value="">All drivers</option>' + state.helpers
      .map((helper) => `<option value="${escapeAttribute(helper.helperId)}">${escapeHtml(helper.helperName)}</option>`)
      .join('');
    select.value = preservedValue;
  }

  function hydrateOrderSelects() {
    const options = '<option value="">Select order</option>' + state.orders
      .map((order) => `<option value="${escapeAttribute(order.orderId)}">${escapeHtml(order.orderId)} - ${escapeHtml(order.customerName)}</option>`)
      .join('');
    ['payment-order-id', 'return-order-id'].forEach((id) => {
      const select = document.getElementById(id);
      if (!select) return;
      const preserved = select.value;
      select.innerHTML = options;
      select.value = preserved;
    });
  }

  function hydrateCustomerSelect() {
    const select = document.getElementById('return-customer-id');
    if (!select) return;
    const preserved = select.value;
    select.innerHTML = '<option value="">Select customer</option>' + state.customers
      .map((customer) => `<option value="${escapeAttribute(customer.customerId)}">${escapeHtml(customer.name)} (${escapeHtml(customer.phone)})</option>`)
      .join('');
    select.value = preserved;
  }

  function renderHeroTotals() {
    const totals = state.totals || {};
    const orders = state.orders || [];
    const pending = orders.filter((o) => o.status === 'pending_approval').length;
    const outForDelivery = orders.filter((o) => o.status === 'out_for_delivery').length;
    const delivered = orders.filter((o) => o.status === 'delivered').length;
    const revenue = orders.reduce((sum, o) => sum + Number(o.subtotal || 0), 0);
    const collected = Number(totals.total_collected || 0);
    const unpaid = Number(totals.unpaid_balance || 0);
    const depositsHeld = Number(totals.outstanding_deposits || 0);
    const outstanding = unpaid + depositsHeld;
    const collectedPct = revenue > 0 ? Math.round((collected / revenue) * 100) + '% of booked' : '&mdash;';

    const container = document.getElementById('hero-totals');
    container.className = 'hero-card tile-grid';
    container.innerHTML = `
      <div class="tile ${pending > 0 ? 'danger' : ''}" data-clickable="1" data-hero-action="review-pending" title="Click to filter today by pending approvals">
        <div class="tile-label">Pending approval</div>
        <div class="tile-value">${pending}</div>
        <div class="tile-foot">${pending > 0 ? 'Tap to review' : 'All caught up'}</div>
      </div>
      <div class="tile">
        <div class="tile-label">Out for delivery</div>
        <div class="tile-value">${outForDelivery}</div>
        <div class="tile-foot">${escapeHtml(state.effectiveDate || '')}</div>
      </div>
      <div class="tile">
        <div class="tile-label">Delivered today</div>
        <div class="tile-value">${delivered}</div>
        <div class="tile-foot">of ${orders.length} orders</div>
      </div>
      <div class="tile">
        <div class="tile-label">Revenue booked</div>
        <div class="tile-value">${formatCurrency(revenue)}</div>
        <div class="tile-foot">Subtotal of today's orders</div>
      </div>
      <div class="tile">
        <div class="tile-label">Collected</div>
        <div class="tile-value">${formatCurrency(collected)}</div>
        <div class="tile-foot">${collectedPct}</div>
      </div>
      <div class="tile" title="Unpaid: ${formatCurrency(unpaid)} · Deposits held: ${formatCurrency(depositsHeld)}">
        <div class="tile-label">Outstanding</div>
        <div class="tile-value">${formatCurrency(outstanding)}</div>
        <div class="tile-foot">Unpaid + deposits</div>
      </div>
    `;

    const badge = document.getElementById('today-tab-badge');
    if (badge) {
      badge.textContent = pending > 0 ? String(pending) : '';
      badge.setAttribute('data-count', String(pending));
    }
  }

  function renderPendingApprovalBanner() {
    const banner = document.getElementById('pending-approval-banner');
    const text = document.getElementById('pending-approval-banner-text');
    if (!banner || !text) return;
    const pending = (state.orders || []).filter((o) => o.status === 'pending_approval').length;
    if (pending > 0) {
      text.textContent = `⚠ ${pending} order${pending === 1 ? '' : 's'} awaiting your approval`;
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }

  function jumpToPendingApprovals() {
    activateTab('today');
    const filter = document.getElementById('filter-status');
    if (filter) {
      filter.value = 'pending_approval';
      filter.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const board = document.getElementById('today-board');
    if (board && typeof board.scrollIntoView === 'function') {
      board.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function wireMoneySubTabs() {
    document.querySelectorAll('.sub-nav button[data-money-target]').forEach((btn) => {
      btn.addEventListener('click', () => activateMoneyPanel(btn.dataset.moneyTarget));
    });
  }

  function activateMoneyPanel(target) {
    document.querySelectorAll('.sub-nav button[data-money-target]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.moneyTarget === target);
    });
    document.querySelectorAll('.money-panel').forEach((panel) => {
      panel.classList.toggle('active', panel.dataset.moneyPanel === target);
    });
  }

  function applyOrderMutation(result) {
    if (!result || !result.order) return;
    const nextOrder = result.order;
    const index = state.orders.findIndex((entry) => entry.orderId === nextOrder.orderId);
    if (index === -1) {
      state.orders.unshift(nextOrder);
    } else {
      state.orders[index] = nextOrder;
    }
    if (result.totals) {
      state.totals = result.totals;
    }
    hydrateOrderSelects();
    renderHeroTotals();
    renderTodayBoard();
  }

  function replaceOrderInState(nextOrder) {
    const index = state.orders.findIndex((entry) => entry.orderId === nextOrder.orderId);
    if (index === -1) {
      state.orders.unshift(nextOrder);
    } else {
      state.orders[index] = nextOrder;
    }
  }

  function redrawOrdersView() {
    hydrateOrderSelects();
    renderHeroTotals();
    renderTodayBoard();
  }

  function recalculateMoneySummaryFromState() {
    const selectedDate = state.auditDate || state.effectiveDate || '';
    const relevantOrders = (state.orders || []).filter((order) => normalizeDateString(order.deliveryDate) === normalizeDateString(selectedDate));
    const summary = {
      totalSales: relevantOrders.reduce((sum, order) => sum + Number(order.subtotal || 0), 0),
      totalCollectedCash: 0,
      totalCollectedTransfer: 0,
      unpaidBalances: relevantOrders.reduce((sum, order) => sum + Number(order.balanceDue || 0), 0),
      outstandingDeposits: relevantOrders.reduce((sum, order) => sum + Number(order.depositTotal || 0), 0),
      totalPurchases: (((state.audit || {}).recentPurchases) || []).reduce((sum, row) => sum + Number(row.total_cost || 0), 0),
      totalExpenses: (((state.audit || {}).recentExpenses) || []).reduce((sum, row) => sum + Number(row.amount || 0), 0),
      selectedDate
    };

    (((state.audit || {}).recentPayments) || []).forEach((payment) => {
      const paymentDate = normalizeDateString(payment.payment_date);
      if (paymentDate !== normalizeDateString(selectedDate)) return;
      if (payment.method === 'cash') {
        summary.totalCollectedCash += Number(payment.amount || 0);
      } else {
        summary.totalCollectedTransfer += Number(payment.amount || 0);
      }
    });

    state.audit = Object.assign(createEmptyAuditState(), state.audit || {}, { summary });
  }

  function renderTodayBoard() {
    renderPendingApprovalBanner();
    const statusFilter = document.getElementById('filter-status').value;
    const helperFilter = document.getElementById('filter-helper').value;
    const filtered = state.orders.filter((order) => {
      if (statusFilter && order.status !== statusFilter) return false;
      if (helperFilter && order.assignedHelperId !== helperFilter) return false;
      return true;
    });

    document.getElementById('today-summary').innerHTML = state.config.orderStatuses.map((status) => {
      const count = filtered.filter((order) => order.status === status).length;
      return `<div class="total-card"><div class="muted">${humanize(status)}</div><strong>${count}</strong></div>`;
    }).join('');

    document.getElementById('today-board').innerHTML = state.config.orderStatuses.map((status) => {
      const orders = filtered.filter((order) => order.status === status);
      return `
        <div class="status-column">
          <div class="status-column-head">
            <h3>${humanize(status)}</h3>
            <span class="status-pill">${orders.length}</span>
          </div>
          ${orders.length ? orders.map(renderOrderCard).join('') : `<div class="history-card muted">No ${humanize(status).toLowerCase()} orders.</div>`}
        </div>
      `;
    }).join('');
  }

  function renderOrderCard(order) {
    const helperOptions = ['<option value="">Unassigned</option>']
      .concat(state.helpers.map((helper) => `<option value="${escapeAttribute(helper.helperId)}" ${helper.helperId === order.assignedHelperId ? 'selected' : ''}>${escapeHtml(helper.helperName)}</option>`))
      .join('');
    const allowedStatuses = state.config.orderStatuses.filter((status) => status !== 'delivered' || order.paymentStatus === 'paid' || order.status === 'delivered');
    const statusOptions = allowedStatuses
      .map((status) => `<option value="${escapeAttribute(status)}" ${status === order.status ? 'selected' : ''}>${humanize(status)}</option>`)
      .join('');
    const paymentClass = order.paymentStatus === 'unpaid' ? 'danger' : (order.paymentStatus === 'partial' ? 'warn' : '');
    const depositText = order.depositTotal > 0 ? `${formatCurrency(order.depositTotal)} charged` : 'No deposit charged';
    const canComplete = order.status !== 'delivered' && order.status !== 'cancelled' && order.paymentStatus === 'paid';
    return `
      <article class="order-card">
        <div class="order-card-head">
          <div>
            <button class="inline-link-button" type="button" onclick="openCustomerFromOrder('${escapeJs(order.phone)}')">${escapeHtml(order.customerName)}</button>
            <div class="muted">${escapeHtml(order.phone)}</div>
            <div class="muted">${escapeHtml(order.address)}</div>
          </div>
          <div>
            <div class="status-pill ${paymentClass}">${humanize(order.paymentStatus)}</div>
            <div class="muted top-gap">${escapeHtml(order.orderId)}</div>
          </div>
        </div>
        <div class="mini-meta">
          <div><strong>Source:</strong> ${escapeHtml(order.sourceChannel || 'unknown')}</div>
          <div><strong>Window:</strong> ${escapeHtml(order.deliveryWindow || 'Flexible')}</div>
          <div><strong>Items:</strong> ${order.items.map((item) => `${item.quantity} x ${escapeHtml(item.productName)}`).join(', ')}</div>
          <div><strong>Deposit:</strong> ${depositText}</div>
          <div><strong>Balance:</strong> ${formatCurrency(order.balanceDue)}</div>
          ${order.notes ? `<div><strong>Notes:</strong> ${escapeHtml(order.notes)}</div>` : ''}
        </div>
        <div class="card-grid-2 top-gap">
          <label>
            Driver
            <select class="inline-select" data-field="assignedHelperId" data-order-id="${escapeAttribute(order.orderId)}">${helperOptions}</select>
          </label>
          <label>
            Status
            <select class="inline-select" data-field="status" data-order-id="${escapeAttribute(order.orderId)}">${statusOptions}</select>
          </label>
        </div>
        <div class="quick-actions top-gap">
          ${order.status === 'pending_approval' ? `<button type="button" onclick="approveOrder('${escapeJs(order.orderId)}')">Approve</button>` : ''}
          ${canComplete ? `<button type="button" onclick="completeOrder('${escapeJs(order.orderId)}')">Complete order</button>` : ''}
          <button type="button" onclick="saveDispatchUpdate('${escapeJs(order.orderId)}')">Update</button>
          <button class="secondary" type="button" onclick="prefillPaymentFromOrder('${escapeJs(order.orderId)}')">Mark payment</button>
        </div>
      </article>
    `;
  }

  function renderCatalogPickers() {
    renderCatalogGroup('catalog-glass', (product) => product.category === 'glass');
    renderCatalogGroup('catalog-jug', (product) => product.category === 'jug');
    renderCatalogGroup('catalog-addon', (product) => product.category !== 'glass' && product.category !== 'jug');
  }

  function renderCatalogGroup(elementId, predicate) {
    const element = document.getElementById(elementId);
    if (!element) return;
    const products = state.products.filter(predicate);
    element.innerHTML = products.map((product) => `
      <article class="catalog-item">
        <div class="catalog-item-head">
          <div>
            <strong>${escapeHtml(product.productName)}</strong>
            <div class="muted">${escapeHtml(product.notes || '')}</div>
          </div>
          <div><strong>${product.unitPrice ? formatCurrency(product.unitPrice) : 'Confirm price'}</strong></div>
        </div>
        <div class="qty-stepper">
          <button class="secondary" type="button" onclick="changeCatalogQty('${escapeJs(product.productId)}', -1)">-</button>
          <input class="catalog-qty" data-product-id="${escapeAttribute(product.productId)}" type="number" min="0" step="1" value="0">
          <button class="secondary" type="button" onclick="changeCatalogQty('${escapeJs(product.productId)}', 1)">+</button>

  function changeCatalogQty(productId, delta) {
    const input = document.querySelector(`.catalog-qty[data-product-id="${cssEscape(productId)}"]`);
    if (!input) return;
    const nextValue = Math.max(0, Number(input.value || 0) + delta);
    input.value = nextValue;
    updateOrderComposer();
  }

  function collectCatalogItems() {
    return Array.from(document.querySelectorAll('.catalog-qty')).map((input) => {
      const quantity = Number(input.value || 0);
      if (quantity <= 0) return null;
      const product = state.products.find((entry) => entry.productId === input.dataset.productId);
      if (!product) return null;
      return {
        productId: product.productId,
        productName: product.productName,
        quantity,
        unitPrice: Number(product.unitPrice || 0),
        category: product.category,
        containerType: product.containerType,
        defaultDepositAmount: Number(product.defaultDepositAmount || 0)
      };
    }).filter(Boolean);
  }

  function buildSelectedItems() {
    const grouped = {};
    collectCatalogItems().forEach((item) => {
      const key = `${item.productId}::${item.unitPrice}`;
      if (!grouped[key]) {
        grouped[key] = Object.assign({}, item);
      } else {
        grouped[key].quantity += item.quantity;
      }
    });
    return Object.values(grouped);
  }

  function updateOrderComposer() {
    const items = buildSelectedItems();
    const subtotal = items.reduce((sum, item) => sum + (item.quantity * item.unitPrice), 0);
    const depositBreakdown = {};
    items.forEach((item) => {
      if (!item.defaultDepositAmount || !item.containerType) return;
      if (!depositBreakdown[item.containerType]) {
        depositBreakdown[item.containerType] = { qty: 0, amount: 0 };
      }
      depositBreakdown[item.containerType].qty += item.quantity;
      depositBreakdown[item.containerType].amount += item.quantity * item.defaultDepositAmount;
    });

    const containerTypes = Object.keys(depositBreakdown);
    const suggestedDepositQty = containerTypes.reduce((sum, key) => sum + depositBreakdown[key].qty, 0);
    const suggestedDepositAmount = containerTypes.reduce((sum, key) => sum + depositBreakdown[key].amount, 0);
    const initialPayment = Number(document.getElementById('initial-payment-amount').value || 0);
    const totalDue = subtotal + suggestedDepositAmount;
    const remainingDue = totalDue - initialPayment;
    const depositLabel = containerTypes.length === 1 ? containerTypes[0] : (containerTypes.length ? 'mixed_container_deposit' : '');

    document.getElementById('deposit-container-type').value = depositLabel;
    document.getElementById('deposit-qty').value = suggestedDepositQty || '';
    document.getElementById('deposit-amount').value = suggestedDepositAmount || '';

    document.getElementById('order-totals').innerHTML = [
      ['Catalog items', items.length],
      ['Subtotal', formatCurrency(subtotal)],
      ['Suggested deposit', formatCurrency(suggestedDepositAmount)],
      ['Initial payment', formatCurrency(initialPayment)],
      ['Total due', formatCurrency(totalDue)],
      ['Remaining due', formatCurrency(remainingDue)]
    ].map(([label, value]) => `<div class="total-card"><div class="muted">${label}</div><strong>${value}</strong></div>`).join('');
  }

  async function saveOrderFromForm() {
    try {
      const form = document.getElementById('order-form');
      const payload = Object.fromEntries(new FormData(form).entries());
      const items = buildSelectedItems();
      if (!items.length) {
        document.getElementById('form-feedback').textContent = 'Select at least one item before saving.';
        return;
      }

      const depositBreakdown = items
        .filter((item) => item.defaultDepositAmount && item.containerType)
        .map((item) => `${item.quantity} x ${item.containerType} (${formatCurrency(item.quantity * item.defaultDepositAmount)})`)
        .join(' | ');

      payload.items = items.map((item) => ({
        productId: item.productId,
        quantity: item.quantity,
        unitPrice: item.unitPrice
      }));
      payload.sourceChannel = 'phone';
      payload.status = 'new';
      payload.initialPaymentAmount = Number(document.getElementById('initial-payment-amount').value || 0);
      payload.initialPaymentMethod = document.getElementById('initial-payment-method').value;
      payload.initialPaymentReference = document.getElementById('initial-payment-reference').value;

      payload.depositAmount = Number(document.getElementById('deposit-amount').value || 0);

  async function saveDispatchUpdate(orderId) {
    const getValue = (field) => document.querySelector(`[data-field="${field}"][data-order-id="${cssEscape(orderId)}"]`);
    const index = state.orders.findIndex((entry) => entry.orderId === orderId);
    const previousOrder = index === -1 ? null : cloneData(state.orders[index]);
    try {
      if (index !== -1) {
        replaceOrderInState(Object.assign({}, state.orders[index], {
          assignedHelperId: getValue('assignedHelperId').value,
          status: getValue('status').value,
          updatedAt: new Date().toISOString()
        }));
        redrawOrdersView();
      }
      const result = await runServer('updateOrderDispatch', {
        orderId,
        assignedHelperId: getValue('assignedHelperId').value,
        status: getValue('status').value
      });
      applyOrderMutation(result);
    } catch (error) {
      if (previousOrder) {
        replaceOrderInState(previousOrder);
        redrawOrdersView();
      }
      alert(error.message);
    }
  }

  async function approveOrder(orderId) {
    const index = state.orders.findIndex((entry) => entry.orderId === orderId);
    if (index === -1) return;
    const previousOrder = JSON.parse(JSON.stringify(state.orders[index]));
    try {
      const optimisticOrder = Object.assign({}, state.orders[index], {
        status: 'new',
        updatedAt: new Date().toISOString()
      });
      replaceOrderInState(optimisticOrder);
      redrawOrdersView();

      const result = await runServer('approvePublicOrder', { orderId });
      applyOrderMutation(result);
    } catch (error) {
      replaceOrderInState(previousOrder);
      redrawOrdersView();
      alert(error.message || String(error));
    }
  }

  async function completeOrder(orderId) {
    const index = state.orders.findIndex((entry) => entry.orderId === orderId);
    if (index === -1) return;
    const previousOrder = cloneData(state.orders[index]);
    if (previousOrder.paymentStatus !== 'paid') {
      alert('Order can only be completed after it is fully paid.');
      return;
    }
    try {
      replaceOrderInState(Object.assign({}, previousOrder, {
        status: 'delivered',
        updatedAt: new Date().toISOString()
      }));
      redrawOrdersView();
      const result = await runServer('updateOrderDispatch', {
        orderId,
        assignedHelperId: previousOrder.assignedHelperId || '',
        status: 'delivered'
      });
      applyOrderMutation(result);
    } catch (error) {
      replaceOrderInState(previousOrder);
      redrawOrdersView();
      alert(error.message || String(error));

  }

  async function savePayment() {
    const orderId = document.getElementById('payment-order-id').value;
    const amount = Number(document.getElementById('payment-amount').value || 0);
    const method = document.getElementById('payment-method').value;
    const paymentDate = document.getElementById('payment-date').value;
    const reference = document.getElementById('payment-reference').value;
    const receivedBy = document.getElementById('payment-received-by').value;
    const proofLink = document.getElementById('payment-proof-link').value;
    const orderIndex = state.orders.findIndex((entry) => entry.orderId === orderId);
    const previousOrder = orderIndex === -1 ? null : cloneData(state.orders[orderIndex]);
    const previousAudit = cloneData(state.audit || createEmptyAuditState());
    try {
      if (previousOrder && amount > 0) {
        const nextAmountPaid = Number(previousOrder.amountPaid || 0) + amount;
        const nextBalance = Math.max(0, Number(previousOrder.balanceDue || 0) - amount);
        replaceOrderInState(Object.assign({}, previousOrder, {
          amountPaid: nextAmountPaid,
          balanceDue: nextBalance,
          paymentStatus: nextBalance <= 0 ? 'paid' : 'partial',
          updatedAt: new Date().toISOString()
        }));

        state.audit = Object.assign(createEmptyAuditState(), state.audit || {});
        state.audit.recentPayments = [{
          payment_id: 'Pending...',
          order_id: orderId,
          payment_date: paymentDate,
          method,
          amount
        }].concat(state.audit.recentPayments || []);
        state.audit.unpaidOrders = (state.orders || [])
          .filter((order) => Number(order.balanceDue || 0) > 0)
          .map((order) => ({
            orderId: order.orderId,
            customerName: order.customerName,
            balanceDue: order.balanceDue,
            phone: order.phone
          }));
        recalculateMoneySummaryFromState();
        redrawOrdersView();
        renderMoneyScreen(false);
      }

      const result = await runServer('recordOrderPayment', {
        orderId,
        paymentDate,
        method,
        amount,
        reference,
        receivedBy,
        proofLink
      });
      applyOrderMutation(result);
      clearFormFields(['payment-amount', 'payment-reference', 'payment-received-by', 'payment-proof-link']);
      loadMoneyData(true);
    } catch (error) {
      if (previousOrder) {
        replaceOrderInState(previousOrder);
      }
      state.audit = previousAudit;
      redrawOrdersView();
      renderMoneyScreen(false);
      alert(error.message);
    }
  }

  }

  function clearFormFields(ids) {
    ids.forEach((id) => {
      const element = document.getElementById(id);
      if (element) element.value = '';
    });
  }

  function setFormField(fieldName, value) {
    const element = document.querySelector(`#order-form [name="${fieldName}"]`) || document.getElementById(fieldName);
    if (element) element.value = value;
  }

  function normalizeDateString(value) {
    return String(value || '').slice(0, 10);
  }

  function humanize(value) {
    return String(value || '').replace(/_/g, ' ').replace(/\b\w/g, (char) => char.toUpperCase());
  }

  function formatCurrency(value) {
    return new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Number(value || 0)) + ' ' + (state.config.currencySymbol || 'VND');
  }

  function escapeHtml(value) {
    return String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  function escapeJs(value) {
    return String(value || '').replaceAll('\\', '\\\\').replaceAll("'", "\\'");
  }

  function cssEscape(value) {
    return String(value || '').replaceAll('"', '\\"');
  }
</script>
